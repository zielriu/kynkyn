<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Arkyn</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c1c1e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%231c1c1e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e0303f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Noto+Serif+JP:wght@400;500&display=swap">
<style>
  :root{
    --ink:#1c1c1e;
    --cream:#f2f0ea;
    --serif-en:'EB Garamond', Georgia, serif;
    --serif-jp:'Noto Serif JP', serif;
    --sans:Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; margin:0; background:var(--ink); color:var(--cream); font-family:var(--sans); }
  body{ display:grid; place-items:center; text-align:center; overflow:hidden; }

  canvas{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }

  main{ position:relative; padding:0 24px; animation:in 1.2s ease both 0.15s; }
  @keyframes in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

  .code{
    margin:0; line-height:1; opacity:0.92;
    font-family:var(--serif-en); font-style:italic; font-weight:400;
    font-size:clamp(84px, 18vw, 176px);
  }
  [data-lang]{ display:none; }
  [data-lang].active{ display:block; }
  .jp{ font-family:var(--serif-jp); font-size:clamp(17px, 2.4vw, 23px); line-height:2; margin:26px 0 0; }
  .en{ font-family:var(--serif-en); font-style:italic; font-size:clamp(17px, 2.2vw, 20px); color:rgba(242,240,234,0.62); margin:26px 0 0; }

  a.back{
    display:inline-block; margin-top:46px; padding:10px 22px;
    font-size:12px; letter-spacing:0.14em; text-decoration:none; color:inherit;
    border:1px solid rgba(242,240,234,0.3);
    transition:color 0.25s, border-color 0.25s;
  }
  a.back:hover, a.back:focus-visible{ color:#a9bfd3; border-color:#a9bfd3; outline:none; }

  @media (prefers-reduced-motion: reduce){ main{ animation:none; } }
</style>
</head>
<body>
  <canvas id="dust" aria-hidden="true"></canvas>

  <main>
    <p class="code">404</p>

    <div data-lang="ja" class="active">
      <p class="jp">ページが見つかりません。<br>道に迷ったみたいです。</p>
    </div>
    <div data-lang="en">
      <p class="en">this page doesn't exist,<br>or it wandered off.</p>
    </div>

    <a class="back" id="back" href="/kynkyn/">
      <span data-lang="ja" class="active">戻る</span><span data-lang="en">go back</span>
    </a>
  </main>

<script>
  // GitHub Pages serves this file for ANY missing address, so relative links
  // would break on deeper paths. This is the site's real front page:
  // "/kynkyn/" while it lives at <name>.github.io/kynkyn, or "/" if you ever
  // move it to its own domain or a <name>.github.io repo.
  const HOME = '/kynkyn/';
  document.getElementById('back').href = HOME;

  // same language the main page last used (they share localStorage)
  let lang = 'ja';
  try { const saved = localStorage.getItem('lang'); if (saved === 'en') lang = 'en'; } catch (e) {}
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-lang]').forEach(el => el.classList.toggle('active', el.dataset.lang === lang));

  // the same drifting dust as the front page's hero, simplified
  (function(){
    const canvas = document.getElementById('dust');
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const CREAM = '242,240,234', RED = '224,48,63';
    const sprites = {};
    const dust = [];
    let w = 0, h = 0;

    function sprite(rgb){
      if (sprites[rgb]) return sprites[rgb];
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(' + rgb + ',1)');
      grad.addColorStop(0.25, 'rgba(' + rgb + ',0.35)');
      grad.addColorStop(1, 'rgba(' + rgb + ',0)');
      g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
      return (sprites[rgb] = c);
    }
    function spawn(p, anywhere){
      p.x = Math.random() * w;
      p.y = anywhere ? Math.random() * h : h + 12;
      p.r = 4 + Math.random() * 7;
      p.vy = 5 + Math.random() * 14;
      p.sway = 6 + Math.random() * 18;
      p.speed = 0.2 + Math.random() * 0.4;
      p.phase = Math.random() * Math.PI * 2;
      p.alpha = 0.4 + Math.random() * 0.6;
      p.twinkle = 0.4 + Math.random() * 1.2;
      p.color = Math.random() < 0.18 ? RED : CREAM;
      return p;
    }
    function resize(){
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const want = w < 761 ? 26 : 52;
      while (dust.length < want) dust.push(spawn({}, true));
    }
    function draw(t, dt){
      ctx.clearRect(0, 0, w, h);
      for (const p of dust) {
        p.y -= p.vy * dt;
        if (p.y < -12) spawn(p, false);
        const x = p.x + Math.sin(t * p.speed + p.phase) * p.sway;
        ctx.globalAlpha = p.alpha * (0.55 + 0.45 * Math.sin(t * p.twinkle + p.phase * 3));
        ctx.drawImage(sprite(p.color), x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      }
      ctx.globalAlpha = 1;
    }

    resize();
    draw(0, 0);
    window.addEventListener('resize', () => { resize(); if (still) draw(0, 0); });
    if (still) return;

    let last = performance.now();
    (function loop(now){
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      if (!document.hidden) draw(now / 1000, dt);
      requestAnimationFrame(loop);
    })(last);
  })();
</script>
</body>
</html>
